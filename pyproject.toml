[project]
name = "gtaa"
version = "0.1.0"
description = "Meb Faber's GTAA AGG 3 / AGG 6: current signals and a monthly backtest, on DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["duckdb>=1.0", "pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gtaa = "gtaa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gtaa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
